name: Archipelago release

# Once a week, and by hand: when Archipelago has a release newer than the
# one the tracker is tested against, package.json's version, open an issue
# to test against it, unless one is open already.
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      # The tool takes nothing from node_modules, so there's nothing to install.
      - id: release
        run: bun run tools/archipelago-release.ts >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      # The versions reach the script through its environment, never written into it.
      - if: steps.release.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.release.outputs.latest }}
          TESTED: ${{ steps.release.outputs.tested }}
        run: |
          export TITLE="Archipelago $LATEST is out"
          open=$(gh issue list --state open --limit 100 --json title --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$open" = "0" ]; then
            gh issue create --title "$TITLE" --body "Archipelago $LATEST is newer than $TESTED, the release the tracker is tested against: https://github.com/ArchipelagoMW/Archipelago/releases/tag/$LATEST

          Try the tracker on a room of the new release, then raise package.json's version to $LATEST."
          fi
