<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Elden Ring Archipelago Tracker</title>
    <style>
      /* The ground and the loader, the only things on screen until the page
         is ready. Their colours are written out rather than taken from the
         tokens: the stylesheets arrive with the module, and this has to be
         painted before that, or a loader is just another thing to load. They
         are the ground, heading-ink and error tokens of src/tokens.css. */
      html {
        background: #0e0d0b;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 999;
        /* The same ground behind the two halves. On an odd number of pixels
           they meet on half of one, and the hairline that leaves would show
           the page through it. It goes the moment they part. */
        background: #0e0d0b;
      }
      #loading .marks {
        position: absolute;
        width: 0;
        height: 0;
      }
      /* Two halves of one curtain. Each is half the window wide and hides
         what falls outside it. */
      #loading .half {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        overflow: hidden;
        background: #0e0d0b;
        transition: transform 520ms cubic-bezier(0.65, 0, 0.35, 1);
      }
      #loading .left {
        left: 0;
      }
      #loading .right {
        right: 0;
      }
      /* Inside each half, the whole window, so the mark lands in the same
         place on both sides and the seam falls down the middle of it. */
      #loading .pane {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 200%;
      }
      #loading .left .pane {
        left: 0;
      }
      #loading .right .pane {
        right: 0;
      }
      /* A little above the middle, leaving room under it for the room's
         card. */
      #loading .mark {
        position: absolute;
        left: 50%;
        top: 36%;
        width: min(72vw, 640px);
        transform: translate(-50%, -50%);
      }
      #loading .mark svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      /* pathLength makes each outline one unit long whatever its real
         length, so every letter draws at one pace, each a beat after the one
         before. The draw runs once, from the first paint, and holds: a mark
         cut off half-drawn reads as a fault rather than a wait. It runs on
         the main thread, so the app's code waits to run until it is done. */
      #loading use {
        fill: none;
        stroke: #e8dcc0;
        stroke-width: 26;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: draw 700ms ease-in-out forwards;
        animation-delay: calc(var(--i) * 60ms);
      }
      /* Under "Tracker", from the first paint: a bar a third of its width,
         sweeping from end to end and back for as long as the wait lasts.
         Placed by the mark's own proportions, and as thick as the letters'
         stroke. Transform only, which the compositor animates on its own, so
         code running on the main thread can't stall it. */
      #loading .wait {
        position: absolute;
        left: 60.64%;
        top: 90.83%;
        width: 38.97%;
        height: 1.2%;
        overflow: hidden;
      }
      #loading .sweep {
        width: calc(100% / 3);
        height: 100%;
        background: #e8dcc0;
        animation: sweep 1200ms ease-in-out infinite alternate;
      }
      /* A load that failed: the bar gives way to what to do, where the
         room's card will sit. */
      #loading .trouble {
        display: none;
        position: absolute;
        left: 16px;
        right: 16px;
        top: calc(36% + min(72vw, 640px) * 0.16359 / 2 + 36px);
        margin: 0;
        text-align: center;
        font:
          1rem/1.5 "EB Garamond",
          Georgia,
          serif;
        color: #e0a08a;
      }
      #loading[data-state="failed"] .wait {
        display: none;
      }
      #loading[data-state="failed"] .trouble {
        display: block;
      }
      /* Waiting on the person at the room's card, with nothing loading: the
         bar fades until there is. */
      #loading[data-state="asking"] .wait {
        opacity: 0;
        transition: opacity 200ms ease;
      }
      #loading .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Opened: the halves leave by their own sides, each with its share of
         the letters. The curtain module takes the node off after the same
         length. */
      #loading.done {
        pointer-events: none;
        background: transparent;
      }
      #loading.done .left {
        transform: translateX(-100%);
      }
      #loading.done .right {
        transform: translateX(100%);
      }
      #loading.done .wait {
        display: none;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      /* A third of the track wide, so twice its own width is the far end. */
      @keyframes sweep {
        to {
          transform: translateX(200%);
        }
      }
      /* Asked for stillness: the mark stands drawn, the bar stands whole, and
         the curtain fades rather than sliding. */
      @media (prefers-reduced-motion: reduce) {
        #loading use,
        #loading .sweep {
          animation: none;
        }
        #loading use {
          stroke-dashoffset: 0;
        }
        #loading .sweep {
          width: 100%;
        }
        #loading .half {
          transition: opacity 200ms ease;
        }
        #loading.done .half {
          transform: none;
          opacity: 0;
        }
      }
    </style>
  </head>
